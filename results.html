</style></head><body><main><header class="brand-header"><img class="brand-logo" src="./takechao-logo.jpg" alt="TAKECHI" width="74" height="82"><div><h1>たけチャート</h1><p class="brand-subtitle"><span>sponsored by</span> たけちゃお</p></div></header><p class="hint" id="publicStatus" role="status">読み込み中…</p><div id="statsPage"><section class="card"><h2>通算成績</h2><p class="hint">累計ポイントの高い順。混在セットのチップとその収支は「すべて」に含まれます。</p><div class="stats-filter"><label>集計期間 <select id="statsPeriod"><option value="month">今月</option><option value="previous">前月</option><option value="year">今年</option><option value="all" selected>全期間</option><option value="range">範囲指定</option></select></label><span id="statsRange" hidden><label>開始日 <input type="date" id="statsFrom"></label> <label>終了日 <input type="date" id="statsTo"></label></span></div><div class="navtabs" aria-label="成績表示"><button id="showTotals" class="active" aria-pressed="true">通算成績</button><button id="showRating" aria-pressed="false">レーティング</button></div><div id="ratingPanel" hidden><label>ルール <select id="ratingMode"><option value="normal">三麻</option><option value="north">四人三麻</option></select></label><p class="hint">全期間の現在R。20半荘未満は暫定です。名前をタップすると選択期間の推移を表示します。</p><table id="ratingTable" class="history-table"></table><div id="ratingTrend"></div></div><div id="totalsPanel" style="overflow-x:auto"><label>ルール <select id="totalsMode"><option value="all">すべて</option><option value="normal">三麻</option><option value="north">四人三麻</option></select></label><table id="statsTable" class="history-table"></table></div><p id="statsNote" class="hint"></p></section><section class="card"><h2>セット履歴</h2><div id="historyList"></div></section></div></main><dialog id="playerStatsDialog" aria-labelledby="playerStatsTitle"><h2 id="playerStatsTitle"></h2><p class="hint" id="playerStatsPeriod"></p><div class="navtabs" id="playerStatsTabs" role="tablist" aria-label="ルール"><button type="button" id="playerRuleAll" role="tab" aria-controls="playerStatsResults" data-mode="all">すべて</button><button type="button" id="playerRuleNormal" role="tab" aria-controls="playerStatsResults" data-mode="normal">三麻</button><button type="button" id="playerRuleNorth" role="tab" aria-controls="playerStatsResults" data-mode="north">四人三麻</button><button type="button" id="playerRuleTrend" role="tab" aria-controls="playerStatsResults" data-mode="trend">推移グラフ</button></div><div id="playerStatsResults" role="tabpanel"></div><p class="hint" id="playerStatsIncomplete" hidden></p><p class="hint" id="playerStatsChipsNote" hidden>混在セットのチップとその収支は「すべて」で集計します。</p><p class="hint" id="playerRankHint">着順は必要人数の点数がそろった半荘で集計。同点は同順位です。抜け番は対局数に含みません。</p><form method="dialog" class="modal-actions"><button class="secondary">閉じる</button></form></dialog><script>const cloudUrl='https://oftvswdircgkjdkedtdu.supabase.co';
const cloudKey='sb_publishable_INcIxUNh_0v-fa6YrT6RDQ_KQTth-Ai';
async function cloudRequest(path,{token,method='GET',data}={}){
  const headers={apikey:cloudKey};
  if(token)headers.Authorization='Bearer '+token;
  if(data!==undefined){
    headers['Content-Type']='application/json';
    headers.Prefer='return=representation';
  }
  const response=await fetch(cloudUrl+path,{method,headers,cache:'no-store',body:data===undefined?undefined:JSON.stringify(data)});
  if(!response.ok)throw Error('HTTP '+response.status);
  return response.json();
}


const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const value=v=>v===''||v==='skip'?0:Number(v)||0;
const fmt=n=>(n>0?'+':'')+n.toLocaleString('ja-JP');
const master=[],editing=null,state={players:[],rounds:[]};
let published=[];
const historyEntries=()=>published.map((set,index)=>({set,index}));
function setResults(set,mode='all'){
  const results=set.players.map(p=>({
    id:p.masterId||master.find(m=>m.name===p.name)?.id||'name:'+p.name,name:master.find(m=>m.id===p.masterId)?.name||p.name,
    pt:0,chips:value(p.chips),rounds:0,ranks:[0,0,0,0],lasts:0
  }));
  for(const round of set.rounds){
    const rule=round.mode==='north'?'north':'normal';
    if(mode!=='all'&&mode!==rule)continue;
    const played=[];
    set.players.forEach((p,i)=>{
      const score=round.scores?.[p.id];
      if(score==null||score===''||score==='skip'||!Number.isInteger(Number(score)))return;
      const result=results[i];
      result.pt+=Number(score);
      result.rounds++;
      played.push({result,score:Number(score)});
    });
    if(played.length!==(round.mode==='north'?4:3))continue;
    for(const player of played){
      const rank=played.filter(other=>other.score>player.score).length;
      player.result.ranks[rank]++;
      if(rank===played.length-1)player.result.lasts++;
    }
  }
  return results.map(r=>({...r,yen:r.pt*Number(set.rate||0)+r.chips*Number(set.chipRate||0)}));
}
function statsDateFilter(){
  const period=$('statsPeriod').value;
  $('statsRange').hidden=period!=='range';
  const from=$('statsFrom').value;
  const to=$('statsTo').value;
  const now=new Date();
  const month=period==='previous'?new Date(now.getFullYear(),now.getMonth()-1,1):now;
  const prefix=period==='year'?String(now.getFullYear()):month.getFullYear()+'/'+String(month.getMonth()+1).padStart(2,'0');
  return set=>{
    if(period==='all')return true;
    if(period!=='range')return set.date?.startsWith(prefix);
    const day=set.date?.replaceAll('/','-');
    return Boolean(day&&(!from||day>=from)&&(!to||day<=to));
  };
}
function aggregateStats(sets,mode='all'){
  const stats=new Map();
  for(const set of sets){
    const rules=new Set(set.rounds.filter(r=>Object.values(r.scores||{}).some(v=>v!=null&&v!==''&&v!=='skip')).map(r=>r.mode==='north'?'north':'normal'));
    const chips=mode==='all'||(rules.size===1&&rules.has(mode));
    for(const r of setResults(set,mode)){
      if(mode!=='all'&&!r.rounds&&!(chips&&r.chips))continue;
      const a=stats.get(r.id)||{id:r.id,name:r.name,pt:0,chips:0,rounds:0,yen:0,sets:0,lasts:0,ranks:[0,0,0,0]};
      a.name=r.name;
      a.pt+=r.pt;
      a.chips+=chips?r.chips:0;
      a.rounds+=r.rounds;
      a.yen+=chips?r.yen:r.pt*Number(set.rate||0);
      a.lasts+=r.lasts;
      a.sets++;
      r.ranks.forEach((count,i)=>a.ranks[i]+=count);
      stats.set(r.id,a);
    }
  }
  return [...stats.values()].sort((a,b)=>b.pt-a.pt);
}
function renderStats(){
  const current=editing?.current||state;
  const history=historyEntries();
  const matches=statsDateFilter();
  if(!$('ratingPanel').hidden)renderRatings(history.map(entry=>entry.set),matches);
  const mode=$('totalsMode').value;
  const rows=aggregateStats(history.map(entry=>entry.set).filter(matches),mode);
  const rankCount=mode==='all'?0:mode==='north'?4:3;
  const headings=['プレイヤー','累計ポイント','収支','通算セット数','通算半荘数','通算チップ','トップ率','ラス率',...Array.from({length:rankCount},(_,i)=>(i+1)+'着')];
  $('statsTable').innerHTML='<thead><tr>'+headings.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>{
    const ranked=r.ranks.reduce((sum,n)=>sum+n,0);
    const percent=n=>ranked?(100*n/ranked).toFixed(1)+'%':'—';
    const cells=[fmt(r.pt)+' pt',fmt(r.yen)+' pt',r.sets,r.rounds,fmt(r.chips),percent(r.ranks[0]),percent(r.lasts),...r.ranks.slice(0,rankCount)];
    return `<tr><td><button class="player-stats-link" data-player-stats="${esc(r.id)}">${esc(r.name)}</button></td>${cells.map((v,i)=>`<td class="${i<2&&v.startsWith('-')?'negative':''}">${v}</td>`).join('')}</tr>`;
  }).join('')+'</tbody>';
  const reversed=$('statsPeriod').value==='range'&&$('statsFrom').value&&$('statsTo').value&&$('statsFrom').value>$('statsTo').value;
  $('statsNote').textContent=reversed?'終了日は開始日以降にしてください。':rows.length?'通算半荘は点数を入力した回数です。着順と割合は対局人数分の点数がそろった半荘で集計します。同点は同順位です。':'まだ集計できるデータがありません。';
  history.sort((a,b)=>(b.set.date||'').localeCompare(a.set.date||'')||Number(b.set.sequence||0)-Number(a.set.sequence||0));
  $('historyList').innerHTML=history.map(({set,index})=>{
    const results=setResults(set);
    const label="",edit="",remove="";
    return `<details class="history-card"><summary>${esc(set.date||'日付不明')} - ${esc(set.sequence||1)} ${label}　${results.length}人</summary>${edit} ${remove}<table class="history-table"><thead><tr><th>名前</th><th>pt</th><th>チップ</th><th>精算額</th></tr></thead><tbody>${results.map(r=>`<tr><td>${esc(r.name)}</td><td>${fmt(r.pt)}</td><td>${fmt(r.chips)}</td><td>${fmt(r.yen)}pt</td></tr>`).join('')}</tbody></table></details>`;
  }).join('');
}
function calculateRatings(sets,mode){
  const players=new Map();
  const required=mode==='north'?4:3;
  const ordered=[...sets].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||Number(a.sequence||0)-Number(b.sequence||0));
  for(const set of ordered){
    for(const round of set.rounds){
      if((round.mode==='north'?'north':'normal')!==mode)continue;
      const played=[];
      for(const player of set.players){
        const score=round.scores?.[player.id];
        if(score==null||score===''||score==='skip'||!Number.isInteger(Number(score)))continue;
        const match=master.find(m=>m.id===player.masterId)||master.find(m=>m.name===player.name);
        played.push({id:player.masterId||match?.id||'name:'+player.name,name:match?.name||player.name,score:Number(score)});
      }
      if(played.length!==required||new Set(played.map(p=>p.id)).size!==required||played.reduce((sum,p)=>sum+p.score,0)!==0)continue;
      const table=played.map(p=>({...p,before:players.get(p.id)?.rating??1500}));
      for(const player of table){
        let change=0;
        for(const opponent of table){
          if(opponent.id===player.id)continue;
          const actual=player.score===opponent.score?0.5:Number(player.score>opponent.score);
          const expected=1/(1+10**((opponent.before-player.before)/400));
          change+=24*(actual-expected)/(required-1);
        }
        const entry=players.get(player.id)||{id:player.id,history:[]};
        entry.name=player.name;
        entry.rating=player.before+change;
        entry.change=Math.round(entry.rating)-Math.round(player.before);
        entry.history.push({date:set.date,rating:entry.rating,before:player.before});
        players.set(player.id,entry);
      }
    }
  }
  return [...players.values()].sort((a,b)=>b.rating-a.rating);
}
let ratingPlayerId;
function renderRatings(sets,matches){
  const rows=calculateRatings(sets,$('ratingMode').value);
  $('ratingTable').innerHTML='<thead><tr><th>プレイヤー</th><th>現在R</th><th>対象半荘</th><th>直近</th></tr></thead><tbody>'+rows.map(p=>
    `<tr><td><button type="button" class="player-stats-link" data-rating-player="${esc(p.id)}">${esc(p.name)}</button></td><td><b>${Math.round(p.rating)}</b>${p.history.length<20?' <small>暫定</small>':''}</td><td>${p.history.length}</td><td>${fmt(p.change)}</td></tr>`).join('')+'</tbody>';
  const player=rows.find(p=>p.id===ratingPlayerId);
  const points=player?.history.filter(matches)||[];
  const panel=$('ratingTrend');
  panel.textContent='';
  if(!rows.length){panel.textContent='対象の半荘はまだありません。';return}
  if(!player)return;
  if(!points.length){panel.textContent='選択期間に対象の半荘がありません。';return}
  const values=[points[0].before,...points.map(p=>p.rating)];
  const min=values.reduce((a,b)=>Math.min(a,b));
  const max=values.reduce((a,b)=>Math.max(a,b));
  const path=values.map((v,i)=>`${38+i*274/(values.length-1)},${max===min?56:100-(v-min)*88/(max-min)}`).join(' ');
  panel.innerHTML=`<figure class="player-trend"><figcaption>${esc(player.name)}のR推移　${Math.round(values[0])} → ${Math.round(values.at(-1))}</figcaption><svg viewBox="0 0 324 124" role="img" aria-label="選択期間のレーティング推移"><text x="2" y="${max===min?60:15}" font-size="10">${Math.round(max)}</text>${max!==min?`<text x="2" y="104" font-size="10">${Math.round(min)}</text>`:''}<polyline points="${path}" fill="none" stroke="#c60027" stroke-width="2.5"/><text x="38" y="118" font-size="9">${esc(points[0].date)}</text>${points.length>1?`<text x="312" y="118" text-anchor="end" font-size="9">${esc(points.at(-1).date)}</text>`:''}</svg></figure>`;
}
function selectStatsView(rating){
  $('ratingPanel').hidden=!rating;
  $('totalsPanel').hidden=rating;
  $('statsNote').hidden=rating;
  for(const [id,active] of [['showTotals',!rating],['showRating',rating]]){
    $(id).classList.toggle('active',active);
    $(id).setAttribute('aria-pressed',String(active));
  }
  renderStats();
}
$('showTotals').onclick=()=>selectStatsView(false);
$('showRating').onclick=()=>selectStatsView(true);
$('ratingMode').onchange=renderStats;
$('ratingTable').onclick=e=>{
  const button=e.target.closest('[data-rating-player]');
  if(!button)return;
  ratingPlayerId=button.dataset.ratingPlayer;
  renderRatings([...historyEntries().map(entry=>entry.set),editing?.current||state],statsDateFilter());
};
let selectedPlayerId;
let playerStatsMode='all';
function renderPlayerTrends(sets){
  const series=[['ポイント','pt'],['チップ','枚'],['収支','pt']];
  const totals=[0,0,0];
  const points=[];
  for(const set of sets){
    const result=setResults(set).find(player=>player.id===selectedPlayerId);
    if(!result||(result.rounds===0&&result.chips===0))continue;
    [result.pt,result.chips,result.yen].forEach((n,i)=>totals[i]+=n);
    points.push({date:set.date||'日付不明',values:[...totals]});
  }
  $('playerRankHint').hidden=true;
  $('playerStatsIncomplete').hidden=true;
  $('playerStatsChipsNote').hidden=true;
  if(!points.length){
    $('playerStatsResults').textContent='この期間の対局データはありません。';
    return;
  }
  $('playerStatsResults').innerHTML='<p class="hint">全ルールのセットごとの累計。選択期間の開始時点を0として表示します。</p>'+series.map(([label,unit],i)=>{
    const values=[0,...points.map(point=>point.values[i])];
    const min=values.reduce((a,b)=>Math.min(a,b),0);
    const max=values.reduce((a,b)=>Math.max(a,b),0);
    const x=index=>54+index*254/(values.length-1);
    const y=value=>max===min?51:92-(value-min)*80/(max-min);
    const path=values.map((value,index)=>`${x(index)},${y(value)}`).join(' ');
    const last=values.at(-1);
    const ticks=max===min?[0]:[max,min];
    return `<figure class="player-trend"><figcaption>${label}　${fmt(last)} ${unit}</figcaption>
      <svg viewBox="0 0 324 116" role="img" aria-label="${label}の累計推移">
      <line x1="54" x2="308" y1="${y(0)}" y2="${y(0)}" stroke="#b4b4ba" stroke-dasharray="3 3"/>
      ${ticks.map(value=>`<text x="49" y="${y(value)+3}" text-anchor="end" font-size="9" fill="#555861">${fmt(value)}</text>`).join('')}
      <polyline points="${path}" fill="none" stroke="#c60027" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="${x(values.length-1)}" cy="${y(last)}" r="3" fill="#c60027"/>
      <text x="54" y="110" font-size="9" fill="#555861">${esc(points[0].date)}</text>
      ${points.length>1?`<text x="308" y="110" text-anchor="end" font-size="9" fill="#555861">${esc(points.at(-1).date)}</text>`:''}
      </svg></figure>`;
  }).join('');
}
function renderPlayerStats(){
  const current=editing?.current||state;
  const matches=statsDateFilter();
  const mode=playerStatsMode;
  const sets=[...historyEntries().map(entry=>entry.set),current].filter(matches);
  if(mode==='trend'){
    sets.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||Number(a.sequence||0)-Number(b.sequence||0));
    renderPlayerTrends(sets);
    return;
  }
  const totals={rounds:0,pt:0,chips:0,yen:0,lasts:0,ranks:[0,0,0,0]};
  let hasMixedChips=false;
  for(const set of sets){
    const playedRules=new Set(set.rounds
      .filter(round=>Object.values(round.scores||{}).some(score=>score!=null&&score!==''&&score!=='skip'))
      .map(round=>round.mode==='north'?'north':'normal'));
    const includeChips=mode==='all'||(playedRules.size===1&&playedRules.has(mode));
    for(const result of setResults(set,mode)){
      if(result.id!==selectedPlayerId)continue;
      if(includeChips)totals.chips+=result.chips;
      totals.yen+=includeChips?result.yen:result.pt*Number(set.rate||0);
      if(!includeChips&&playedRules.size>1&&playedRules.has(mode)&&result.chips!==0)hasMixedChips=true;
      totals.rounds+=result.rounds;
      totals.pt+=result.pt;
      totals.lasts+=result.lasts;
      result.ranks.forEach((count,i)=>totals.ranks[i]+=count);
    }
  }
  const ranked=totals.ranks.reduce((sum,count)=>sum+count,0);
  const incomplete=totals.rounds-ranked;
  $('playerStatsIncomplete').hidden=mode==='all'||incomplete===0;
  $('playerRankHint').hidden=mode==='all';
  $('playerStatsIncomplete').textContent=`点数がそろっていない ${incomplete} 半荘は着順の集計から除外しています。`;
  $('playerStatsChipsNote').hidden=!hasMixedChips;
  const percent=count=>ranked?(count*100/ranked).toFixed(1)+'%':'—';
  const averageRank=ranked?(totals.ranks.reduce((sum,count,i)=>sum+count*(i+1),0)/ranked).toFixed(2):'—';
  const averagePt=totals.rounds?(totals.pt/totals.rounds).toFixed(2)+' pt':'—';
  const metrics=[
    ['対局数',totals.rounds],
    ['累計pt',fmt(totals.pt)+' pt'],
    ['累計チップ',fmt(totals.chips)+' 枚'],
    ['累計収支',fmt(totals.yen)+' pt']
  ];
  if(mode!=='all')metrics.push(
    ['トップ率',percent(totals.ranks[0])],['連対率',percent(totals.ranks[0]+totals.ranks[1])],
    ['ラス率',percent(totals.lasts)],['平均順位',averageRank],['平均pt',averagePt],
    ['着順内訳',totals.ranks.slice(0,mode==='normal'?3:4).map((n,i)=>`${i+1}着 ${n}回`).join(' ／ ')]
  );
  $('playerStatsResults').innerHTML='<table class="history-table"><tbody>'+metrics.map(([label,result])=>
    `<tr><th scope="row">${label}</th><td>${result}</td></tr>`).join('')+'</tbody></table>';
}
$('statsTable').onclick=e=>{
  const button=e.target.closest('[data-player-stats]');
  if(!button)return;
  selectedPlayerId=button.dataset.playerStats;
  $('playerStatsTitle').textContent=button.textContent+'の個人成績';
  const period=$('statsPeriod');
  const range=period.value==='range'?`（${$('statsFrom').value||'指定なし'} ～ ${$('statsTo').value||'指定なし'}）`:'';
  $('playerStatsPeriod').textContent='集計期間 '+period.selectedOptions[0].textContent+range;
  selectPlayerStatsTab('all');
  $('playerStatsDialog').showModal();
};
function selectPlayerStatsTab(mode){
  playerStatsMode=mode;
  for(const tab of $('playerStatsTabs').querySelectorAll('[role="tab"]')){
    const selected=tab.dataset.mode===mode;
    tab.classList.toggle('active',selected);
    tab.setAttribute('aria-selected',String(selected));
    tab.tabIndex=selected?0:-1;
    if(selected)$('playerStatsResults').setAttribute('aria-labelledby',tab.id);
  }
  renderPlayerStats();
}
$('playerStatsTabs').onclick=e=>{
  const tab=e.target.closest('[role="tab"]');
  if(tab)selectPlayerStatsTab(tab.dataset.mode);
};
$('playerStatsTabs').onkeydown=e=>{
  const tabs=[...$('playerStatsTabs').querySelectorAll('[role="tab"]')];
  const index=tabs.indexOf(e.target);
  const target={ArrowLeft:(index+tabs.length-1)%tabs.length,ArrowRight:(index+1)%tabs.length,Home:0,End:tabs.length-1}[e.key];
  if(index<0||target===undefined)return;
  e.preventDefault();
  selectPlayerStatsTab(tabs[target].dataset.mode);
  tabs[target].focus();
};
$('statsFrom').onchange=$('statsTo').onchange=renderStats;

$('statsPeriod').onchange=$('totalsMode').onchange=renderStats;
let revision,loading=false;
async function refresh(){
  if(loading)return;
  loading=true;
  try{
    const [snapshot]=await cloudRequest('/rest/v1/takechao_public_results?id=eq.1&select=results,updated_at');
    if(snapshot&&snapshot.updated_at===revision)return;
    const payload=snapshot?.results?.find(row=>row?.kind==='sets-v2');
    if(!payload){$('publicStatus').textContent='詳細成績は管理画面の次の自動同期後に表示されます。';return}
    published=payload.sets;
    renderStats();
    revision=snapshot.updated_at;
    $('publicStatus').textContent='閲覧専用｜保存済みセット・更新 '+new Date(revision).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'});
  }catch{$('publicStatus').textContent='成績を読み込めませんでした。'}
  finally{loading=false}
}
refresh();
setInterval(()=>{if(!document.hidden)refresh()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
